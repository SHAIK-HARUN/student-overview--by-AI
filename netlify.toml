[build]
  command = "python -m pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
  publish = "staticfiles"

[functions]
  directory = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  NETLIFY = "true"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/handler"
  status = 200
  force = true

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
